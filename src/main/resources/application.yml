spring:
  application:
    name: resume-builder

  datasource:
    url: jdbc:postgresql://localhost:5432/resume_db
    username: resume_user
    password: resume_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080